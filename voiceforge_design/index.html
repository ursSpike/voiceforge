<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceForge — the evaluation lab after the call</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-ch="sc-thesis" class="presenter">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Presenter rail: scene position + jump dots, always visible in presenter mode -->
  <nav class="rail" id="rail" aria-label="Scenes"></nav>

  <!-- Compact header strip -->
  <header class="topbar" id="topbar">
    <a class="wordmark" href="#sc-thesis" data-jump="sc-thesis">
      <span class="wm-mark" aria-hidden="true"><span class="wm-raw"></span><span class="wm-forged"></span></span>
      <span class="wm-text">Voice<b>Forge</b></span>
    </a>
    <span class="topbar-chapter" id="topbar-chapter" aria-live="polite"></span>
    <span class="gate-chip mono" id="gate-chip"></span>
    <button class="btn corpus-toggle" id="corpus-toggle" aria-haspopup="dialog" aria-expanded="false">Browse corpus</button>
  </header>

  <main id="main" class="deck">
    <!-- SCENE 1 — Thesis + intro -->
    <section class="scene sc-thesis" id="sc-thesis" data-num="1" data-short="Thesis" data-title="Thesis &amp; intro">
      <div class="scene-inner" data-mount="thesis"></div>
    </section>

    <!-- SCENE 2 — Metric trap (25/45) -->
    <section class="scene sc-trap" id="sc-trap" data-num="2" data-short="Metric trap" data-title="The metric trap">
      <div class="scene-inner" data-mount="trap"></div>
    </section>

    <!-- SCENE 3 — Deterministic before judge -->
    <section class="scene sc-measure" id="sc-measure" data-num="3" data-short="Architecture" data-title="Deterministic before judge">
      <div class="scene-inner" data-mount="measure"></div>
    </section>

    <!-- SCENE 4 — Hero call (constructed, disclosed) -->
    <section class="scene sc-hero" id="sc-hero" data-num="4" data-short="Hero call" data-title="The hero call">
      <div class="scene-inner" data-mount="hero"></div>
    </section>

    <!-- SCENE 5 — Blind labels + calibration -->
    <section class="scene sc-judge" id="sc-judge" data-num="5" data-short="Calibration" data-title="Blind labels &amp; calibration">
      <div class="scene-inner" data-mount="judge"></div>
    </section>

    <!-- SCENE 6 — Phenotypes + improvement queue -->
    <section class="scene sc-action" id="sc-action" data-num="6" data-short="Phenotypes" data-title="Phenotypes &amp; the queue">
      <div class="scene-inner" data-mount="action"></div>
    </section>

    <!-- SCENE 7 — Bolna × Cartesia + LIVE TODAY -->
    <section class="scene sc-proof" id="sc-proof" data-num="7" data-short="Sponsors" data-title="Bolna × Cartesia">
      <div class="scene-inner" data-mount="proof"></div>
    </section>

    <!-- SCENE 8 — Value, limits, close -->
    <section class="scene sc-method" id="sc-method" data-num="8" data-short="Close" data-title="Value, limits &amp; close">
      <div class="scene-inner" data-mount="method"></div>
    </section>
  </main>

  <!-- Call evidence sheet: slides over the deck, never loses scene position -->
  <div class="callsheet-scrim" id="callsheet-scrim" hidden></div>
  <aside class="callsheet" id="callsheet" role="dialog" aria-modal="true" aria-labelledby="callsheet-title" hidden>
    <div class="callsheet-frame" data-mount="callsheet"></div>
  </aside>

  <!-- Corpus browser: full 76-call table + full improvement queue live ONLY here -->
  <div class="corpus-scrim" id="corpus-scrim" hidden></div>
  <aside class="corpus" id="corpus" role="dialog" aria-modal="true" aria-labelledby="corpus-title" hidden>
    <div class="corpus-frame" data-mount="corpus"></div>
  </aside>

  <noscript>
    <p class="noscript-note">VoiceForge renders every number from the committed data artifact at load time, so JavaScript is required. No network access is used.</p>
  </noscript>

  <script src="design_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
