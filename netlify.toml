# Netlify deploy — publish out/surface/ which has platform/ copied in.
# No build step (committed pre-assembled to avoid silent build-cmd failures).

[build]
  publish = "out/surface"

[[redirects]]
  from = "/platform"
  to = "/platform/"
  status = 301

[[headers]]
  for = "/platform/platform_data.js"
  [headers.values]
    Cache-Control = "no-store"
